version: '3.8'

services:
  database:
    image: postgres:15
    container_name: job_radar_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: jobradar
    volumes:
      - jobradar_data:/var/lib/postgresql/data

volumes:
  jobradar_data: